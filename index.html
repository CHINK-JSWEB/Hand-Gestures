<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🤖 AI Body Detector</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Courier New', monospace; }
#video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
#hud {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 99;
}
#topbar {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(0,255,180,0.08); border: 1px solid rgba(0,255,180,0.3);
  color: #00ffb4; padding: 6px 20px; border-radius: 4px;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  z-index: 100; backdrop-filter: blur(6px);
  text-shadow: 0 0 10px #00ffb4;
}
#detections {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 100; flex-wrap: wrap; justify-content: center;
}
.det-badge {
  padding: 6px 16px; border-radius: 4px; font-size: 12px;
  letter-spacing: 2px; text-transform: uppercase; font-weight: bold;
  animation: badgePop 0.3s ease;
  backdrop-filter: blur(6px);
}
.det-face { background: rgba(0,200,255,0.15); border: 1px solid #00c8ff; color: #00c8ff; text-shadow: 0 0 12px #00c8ff; box-shadow: 0 0 16px rgba(0,200,255,0.3); }
.det-hand { background: rgba(180,0,255,0.15); border: 1px solid #b400ff; color: #b400ff; text-shadow: 0 0 12px #b400ff; box-shadow: 0 0 16px rgba(180,0,255,0.3); }
.det-pose { background: rgba(0,255,100,0.15); border: 1px solid #00ff64; color: #00ff64; text-shadow: 0 0 12px #00ff64; box-shadow: 0 0 16px rgba(0,255,100,0.3); }
@keyframes badgePop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#scanline {
  position: fixed; top: 0; left: 0; width: 100%; height: 3px;
  background: linear-gradient(90deg, transparent, #00ffb4, transparent);
  animation: scan 3s linear infinite; opacity: 0.4; z-index: 98;
}
@keyframes scan { from { top: 0; } to { top: 100%; } }
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="canvas"></canvas>
<div id="topbar">🤖 AI DETECTOR — ONLINE</div>
<div id="detections"></div>
<div id="scanline"></div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const detectionsEl = document.getElementById('detections');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ── State ──
let faceData = null, handData = null, poseData = null;
let lastSpoken = {};
const SPEAK_COOLDOWN = 4000;

// ── Text-to-Speech ──
function speak(text, color) {
  const now = Date.now();
  if (lastSpoken[text] && now - lastSpoken[text] < SPEAK_COOLDOWN) return;
  lastSpoken[text] = now;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.85;
  utter.pitch = 0.4;  // deep robot voice
  utter.volume = 1;
  // pick a robotic-sounding voice if available
  const voices = speechSynthesis.getVoices();
  const en = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('google')) || voices.find(v => v.lang.startsWith('en'));
  if (en) utter.voice = en;
  speechSynthesis.speak(utter);
}

// ── Draw Helpers ──
function glowRect(x, y, w, h, color, label) {
  ctx.save();
  ctx.shadowBlur = 24;
  ctx.shadowColor = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  // Corner brackets
  const cs = 18;
  ctx.lineWidth = 3;
  [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([cx,cy], i) => {
    ctx.beginPath();
    ctx.moveTo(cx + (i%2===0?0:-(cs)), cy);
    ctx.lineTo(cx + (i%2===0?cs:0), cy);
    ctx.moveTo(cx, cy + (i<2?cs:-cs));
    ctx.lineTo(cx, cy + (i<2?0:0));
    ctx.stroke();
  });

  // Label
  ctx.shadowBlur = 16;
  ctx.fillStyle = color;
  ctx.font = 'bold 13px Courier New';
  ctx.letterSpacing = '2px';
  ctx.fillText(label, x + 6, y - 8);
  ctx.restore();
}

function glowLine(x1, y1, x2, y2, color) {
  ctx.save();
  ctx.shadowBlur = 12;
  ctx.shadowColor = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function glowDot(x, y, color, r = 4) {
  ctx.save();
  ctx.shadowBlur = 14;
  ctx.shadowColor = color;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ── Pose connections ──
const POSE_CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28]
];

// ── Main Draw Loop ──
function drawFrame(image) {
  ctx.save();
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  const detected = [];

  // Face
  if (faceData && faceData.detections && faceData.detections.length > 0) {
    detected.push('face');
    faceData.detections.forEach(det => {
      const bb = det.boundingBox;
      const x = bb.xCenter * canvas.width - (bb.width * canvas.width) / 2;
      const y = bb.yCenter * canvas.height - (bb.height * canvas.height) / 2;
      const w = bb.width * canvas.width;
      const h = bb.height * canvas.height;
      glowRect(x, y, w, h, '#00c8ff', '⬡ FACE DETECTED');
      // keypoints
      det.landmarks?.forEach(lm => {
        glowDot(lm.x * canvas.width, lm.y * canvas.height, '#00c8ff', 3);
      });
    });
  }

  // Hands
  if (handData && handData.multiHandLandmarks && handData.multiHandLandmarks.length > 0) {
    handData.multiHandLandmarks.forEach((lms, hi) => {
      detected.push('hand');
      const xs = lms.map(l => l.x * canvas.width);
      const ys = lms.map(l => l.y * canvas.height);
      const minX = Math.min(...xs) - 16;
      const minY = Math.min(...ys) - 16;
      const maxX = Math.max(...xs) + 16;
      const maxY = Math.max(...ys) + 16;
      const label = handData.multiHandedness?.[hi]?.label === 'Left' ? '⬡ LEFT HAND' : '⬡ RIGHT HAND';
      glowRect(minX, minY, maxX - minX, maxY - minY, '#b400ff', label);
      // skeleton
      const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
      HAND_CONNECTIONS.forEach(([a, b]) => {
        glowLine(lms[a].x*canvas.width, lms[a].y*canvas.height, lms[b].x*canvas.width, lms[b].y*canvas.height, '#b400ff');
      });
      lms.forEach(lm => glowDot(lm.x*canvas.width, lm.y*canvas.height, '#b400ff', 3));
    });
  }

  // Pose
  if (poseData && poseData.poseLandmarks) {
    const lms = poseData.poseLandmarks;
    const visible = lms.filter(l => l.visibility > 0.5);
    if (visible.length > 5) {
      detected.push('body');
      POSE_CONNECTIONS.forEach(([a, b]) => {
        if (lms[a].visibility > 0.5 && lms[b].visibility > 0.5) {
          glowLine(lms[a].x*canvas.width, lms[a].y*canvas.height, lms[b].x*canvas.width, lms[b].y*canvas.height, '#00ff64');
        }
      });
      lms.forEach(lm => {
        if (lm.visibility > 0.5) glowDot(lm.x*canvas.width, lm.y*canvas.height, '#00ff64', 4);
      });
      const xs = visible.map(l => l.x * canvas.width);
      const ys = visible.map(l => l.y * canvas.height);
      glowRect(Math.min(...xs)-20, Math.min(...ys)-20, Math.max(...xs)-Math.min(...xs)+40, Math.max(...ys)-Math.min(...ys)+40, '#00ff64', '⬡ BODY DETECTED');
    }
  }

  // Badges + voice
  const unique = [...new Set(detected)];
  detectionsEl.innerHTML = unique.map(d => {
    if (d === 'face') return `<div class="det-badge det-face">👤 FACE</div>`;
    if (d === 'hand') return `<div class="det-badge det-hand">🖐 HAND</div>`;
    if (d === 'body') return `<div class="det-badge det-pose">🧍 BODY</div>`;
  }).join('');

  unique.forEach(d => {
    if (d === 'face') speak('Face detected', '#00c8ff');
    if (d === 'hand') speak('Hand detected', '#b400ff');
    if (d === 'body') speak('Body detected', '#00ff64');
  });
}

// ── Init MediaPipe ──
const faceDetection = new FaceDetection({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/${f}`
});
faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
faceDetection.onResults(r => { faceData = r; });

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
});
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
hands.onResults(r => { handData = r; });

const pose = new Pose({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`
});
pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
pose.onResults(r => { poseData = r; });

// ── Camera Loop ──
let frameCount = 0;
async function loop() {
  if (video.readyState >= 2) {
    frameCount++;
    // Stagger calls to avoid overloading on mobile
    await hands.send({ image: video });
    drawFrame(video);
    if (frameCount % 2 === 0) await faceDetection.send({ image: video });
    if (frameCount % 3 === 0) await pose.send({ image: video });
  }
  requestAnimationFrame(loop);
}

async function start() {
  // warm up voices
  speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: {ideal:1280}, height: {ideal:720} },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    loop();
  } catch(e) {
    alert('Camera error: ' + e.message);
  }
}

start();
</script>
</body>
</html>
