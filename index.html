<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ Hand Sparkles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Segoe UI', sans-serif; }
  #container { position: relative; width: 100vw; height: 100vh; }
  #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 1; }
  #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  #status { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); color: #fff; padding: 8px 20px; border-radius: 999px; font-size: 13px; letter-spacing: 0.5px; border: 1px solid rgba(255,255,255,0.15); transition: opacity 0.5s; white-space: nowrap; }
  #tip { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.45); backdrop-filter: blur(10px); color: rgba(255,255,255,0.7); padding: 7px 18px; border-radius: 999px; font-size: 12px; letter-spacing: 0.4px; border: 1px solid rgba(255,255,255,0.1); }
  #loading-screen { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 18px; transition: opacity 0.8s; }
  #loading-screen .title { font-size: 32px; font-weight: 300; letter-spacing: 6px; color: #fff; text-transform: uppercase; }
  #loading-screen .sub { font-size: 13px; color: rgba(255,255,255,0.4); letter-spacing: 2px; }
  .loader { width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #start-btn { pointer-events: all; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 12px 36px; border-radius: 999px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: background 0.2s, border-color 0.2s; display: none; }
  #start-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div id="loading-screen">
  <div class="title">✨ Sparkles</div>
  <div class="sub">Hand Gesture Effects</div>
  <div class="loader" id="loader"></div>
  <button id="start-btn" onclick="startCamera()">Allow Camera</button>
</div>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="status">Loading MediaPipe...</div>
    <div id="tip">✨ Move your hands in front of the camera</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const loadingScreen = document.getElementById('loading-screen');
const loader = document.getElementById('loader');
const startBtn = document.getElementById('start-btn');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
const particles = [];
const MAX_PARTICLES = 600;
const COLORS = [[180,220,255],[220,180,255],[255,220,180],[180,255,220],[255,180,220],[255,255,200]];
class Particle {
  constructor(x,y,colorIdx){ this.reset(x,y,colorIdx); }
  reset(x,y,colorIdx){
    this.x=x; this.y=y;
    const angle=Math.random()*Math.PI*2;
    const speed=Math.random()*3+0.5;
    this.vx=Math.cos(angle)*speed;
    this.vy=Math.sin(angle)*speed-1.5;
    this.life=1.0;
    this.decay=Math.random()*0.025+0.015;
    this.size=Math.random()*4+1.5;
    this.color=COLORS[colorIdx%COLORS.length];
    this.twinkle=Math.random()*Math.PI*2;
    this.twinkleSpeed=Math.random()*0.15+0.05;
    this.gravity=0.04;
    this.isStar=Math.random()<0.3;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=this.gravity; this.vx*=0.98; this.life-=this.decay; this.twinkle+=this.twinkleSpeed; }
  draw(ctx){
    if(this.life<=0)return;
    const tf=0.6+0.4*Math.sin(this.twinkle);
    const alpha=this.life*tf;
    const [r,g,b]=this.color;
    const size=this.size*tf;
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(this.x,this.y);
    if(this.isStar){
      ctx.shadowBlur=12; ctx.shadowColor=`rgba(${r},${g},${b},${alpha})`; ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
      drawStar(ctx,0,0,4,size*1.6,size*0.5); ctx.fill();
    } else {
      const grad=ctx.createRadialGradient(0,0,0,0,0,size);
      grad.addColorStop(0,`rgba(${r},${g},${b},${alpha})`);
      grad.addColorStop(0.4,`rgba(${r},${g},${b},${alpha*0.6})`);
      grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
      ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(0,0,size,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=8; ctx.shadowColor=`rgba(255,255,255,${alpha*0.8})`; ctx.fillStyle=`rgba(255,255,255,${alpha*0.9})`; ctx.beginPath(); ctx.arc(0,0,size*0.3,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  get isDead(){ return this.life<=0; }
}
function drawStar(ctx,cx,cy,spikes,outerR,innerR){
  let rot=(Math.PI/2)*3; const step=Math.PI/spikes;
  ctx.beginPath(); ctx.moveTo(cx,cy-outerR);
  for(let i=0;i<spikes;i++){
    ctx.lineTo(cx+Math.cos(rot)*outerR,cy+Math.sin(rot)*outerR); rot+=step;
    ctx.lineTo(cx+Math.cos(rot)*innerR,cy+Math.sin(rot)*innerR); rot+=step;
  }
  ctx.lineTo(cx,cy-outerR); ctx.closePath();
}
function spawnParticles(x,y,count,colorIdx){
  for(let i=0;i<count;i++){
    if(particles.length<MAX_PARTICLES){ particles.push(new Particle(x,y,colorIdx)); }
    else { const dead=particles.find(p=>p.isDead); if(dead)dead.reset(x,y,colorIdx); }
  }
}
const FINGERTIPS=[4,8,12,16,20];
const prevPositions={};
let handsReady=false;
const hands=new Hands({ locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.6 });
function onResults(results){
  ctx.save(); ctx.drawImage(results.image,0,0,canvas.width,canvas.height); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=particles.length-1;i>=0;i--){ particles[i].update(); particles[i].draw(ctx); if(particles[i].isDead)particles.splice(i,1); }
  ctx.restore();
  if(!results.multiHandLandmarks)return;
  results.multiHandLandmarks.forEach((landmarks,handIdx)=>{
    FINGERTIPS.forEach((tipIdx,fingerIdx)=>{
      const lm=landmarks[tipIdx];
      const x=lm.x*canvas.width; const y=lm.y*canvas.height;
      const key=`${handIdx}_${tipIdx}`; const prev=prevPositions[key];
      if(prev){
        const dx=x-prev.x; const dy=y-prev.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        const steps=Math.max(1,Math.floor(dist/8));
        for(let s=0;s<steps;s++){
          const t=s/steps;
          spawnParticles(prev.x+dx*t,prev.y+dy*t,2,(handIdx*5+fingerIdx)%COLORS.length);
        }
      }
      spawnParticles(x,y,3,(handIdx*5+fingerIdx)%COLORS.length);
      prevPositions[key]={x,y};
    });
  });
}
async function startCamera(){
  startBtn.style.display='none'; loader.style.display='block'; statusEl.textContent='Starting camera...';
  try {
    const stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }, audio:false });
    video.srcObject=stream; await video.play();
    statusEl.textContent='Loading hand tracking...';
    const camera=new Camera(video,{
      onFrame:async()=>{ if(handsReady){ await hands.send({image:video}); } },
      width:1280, height:720
    });
    hands.onResults((results)=>{ handsReady=true; onResults(results); });
    camera.start();
    setTimeout(()=>{ loadingScreen.style.opacity='0'; setTimeout(()=>loadingScreen.style.display='none',800); statusEl.textContent='✨ Hand tracking active'; setTimeout(()=>statusEl.style.opacity='0',3000); },1500);
  } catch(err){ statusEl.textContent='⚠️ Camera access denied'; loader.style.display='none'; startBtn.style.display='block'; startBtn.textContent='Retry'; console.error(err); }
}
window.addEventListener('load',()=>{ loader.style.display='none'; startBtn.style.display='block'; statusEl.textContent=''; setTimeout(()=>{ startBtn.click(); },600); });
</script>
</body>
</html>
