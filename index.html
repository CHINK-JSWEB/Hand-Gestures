<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ Hand Sparkles</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
#container { position: relative; width: 100vw; height: 100vh; }
#video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
#status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff; padding: 8px 20px; border-radius: 999px; font-size: 13px; z-index: 999; font-family: sans-serif; white-space: nowrap; }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
</div>
<div id="status">Starting...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ── Particles ──
const particles = [];
const COLORS = [[180,220,255],[220,180,255],[255,220,180],[180,255,220],[255,180,220],[255,255,200]];

class Particle {
  constructor(x, y, ci) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 3 + 0.5;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s - 1.5;
    this.life = 1.0;
    this.decay = Math.random() * 0.025 + 0.015;
    this.size = Math.random() * 4 + 1.5;
    this.color = COLORS[ci % COLORS.length];
    this.gravity = 0.04;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += this.gravity; this.vx *= 0.98;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    const [r,g,b] = this.color;
    const grad = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size);
    grad.addColorStop(0, `rgba(${r},${g},${b},${this.life})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    // bright core
    ctx.fillStyle = `rgba(255,255,255,${this.life * 0.8})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.3, 0, Math.PI*2);
    ctx.fill();
  }
  get dead() { return this.life <= 0; }
}

function spawn(x, y, ci) {
  for (let i = 0; i < 4; i++) particles.push(new Particle(x, y, ci));
}

// ── MediaPipe Hands ──
const TIPS = [4, 8, 12, 16, 20];
const prev = {};

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5
});

hands.onResults(results => {
  // Draw video
  ctx.save();
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  // Draw particles
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].dead) particles.splice(i, 1);
  }
  ctx.restore();

  if (!results.multiHandLandmarks) return;

  results.multiHandLandmarks.forEach((lms, hi) => {
    TIPS.forEach((ti, fi) => {
      const lm = lms[ti];
      const x = lm.x * canvas.width;
      const y = lm.y * canvas.height;
      const key = `${hi}_${ti}`;
      const p = prev[key];
      if (p) {
        const dx = x - p.x, dy = y - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const steps = Math.max(1, Math.floor(dist / 10));
        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          spawn(p.x + dx*t, p.y + dy*t, (hi*5+fi) % COLORS.length);
        }
      }
      spawn(x, y, (hi*5+fi) % COLORS.length);
      prev[key] = {x, y};
    });
  });

  statusEl.style.display = 'none';
});

// ── Camera ──
async function start() {
  statusEl.textContent = 'Starting camera...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: {ideal:1280}, height: {ideal:720} },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = 'Loading hand tracking...';

    async function loop() {
      await hands.send({ image: video });
      requestAnimationFrame(loop);
    }
    loop();

  } catch(e) {
    statusEl.textContent = '⚠️ Camera error: ' + e.message;
  }
}

start();
</script>
</body>
</html>
